name: Update margin

on:
    schedule:
        # Daily at 06:17 UTC
        - cron: "17 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: update-margin
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            current: ${{ steps.versions.outputs.current }}
            latest: ${{ steps.versions.outputs.latest }}
            update: ${{ steps.versions.outputs.update }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Compare npm latest with the formula
              id: versions
              run: |
                  set -euo pipefail
                  current="$(sed -nE 's|^  url ".*/margin-md-([^"]+)\.tgz"$|\1|p' Formula/margin.rb)"
                  latest="$(curl -fsSL https://registry.npmjs.org/margin-md | jq -r '.["dist-tags"].latest')"
                  echo "current=$current" >> "$GITHUB_OUTPUT"
                  echo "latest=$latest" >> "$GITHUB_OUTPUT"
                  newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)"
                  if [[ "$latest" == "$current" || "$newest" != "$latest" ]]; then
                      echo "margin $current is up to date (npm latest: $latest)"
                      echo "update=false" >> "$GITHUB_OUTPUT"
                  elif ! git ls-remote --exit-code --tags https://github.com/ariboren/margin "refs/tags/v$latest" > /dev/null; then
                      echo "::notice::npm has margin-md $latest but ariboren/margin has no tag v$latest yet; skipping."
                      echo "update=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "Updating margin $current -> $latest"
                      echo "update=true" >> "$GITHUB_OUTPUT"
                  fi

    update:
        needs: check
        if: needs.check.outputs.update == 'true'
        runs-on: macos-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            # Checks out this tap into the Homebrew prefix and the workspace, without credentials.
            - name: Set up Homebrew
              id: setup
              uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
            - name: Rewrite the formula
              env:
                  CURRENT: ${{ needs.check.outputs.current }}
                  LATEST: ${{ needs.check.outputs.latest }}
              run: |
                  set -euo pipefail
                  formula=Formula/margin.rb
                  curl -fsSL -o margin.tgz "https://registry.npmjs.org/margin-md/-/margin-md-$LATEST.tgz"
                  curl -fsSL -o bun.lock "https://raw.githubusercontent.com/ariboren/margin/v$LATEST/bun.lock"
                  new_tgz_sha="$(shasum -a 256 margin.tgz | cut -d' ' -f1)"
                  new_lock_sha="$(shasum -a 256 bun.lock | cut -d' ' -f1)"
                  rm margin.tgz bun.lock
                  old_tgz_sha="$(grep -m1 -E '^  sha256 ' "$formula" | cut -d'"' -f2)"
                  old_lock_sha="$(grep -m1 -E '^    sha256 ' "$formula" | cut -d'"' -f2)"
                  sed -i '' \
                      -e "s|margin-md-$CURRENT\.tgz|margin-md-$LATEST.tgz|" \
                      -e "s|/v$CURRENT/bun\.lock|/v$LATEST/bun.lock|" \
                      -e "s|$old_tgz_sha|$new_tgz_sha|" \
                      -e "s|$old_lock_sha|$new_lock_sha|" \
                      "$formula"
                  git diff
            - name: Audit, install and test
              env:
                  TAP: ${{ steps.setup.outputs.tap-name }}
              run: |
                  set -euo pipefail
                  brew audit --strict --online "$TAP/margin"
                  brew install --build-from-source "$TAP/margin"
                  brew test "$TAP/margin"
            - name: Commit and push
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  LATEST: ${{ needs.check.outputs.latest }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -am "margin $LATEST"
                  git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
